</nav></header><main><section class="form-card"><h2>Contact Form</h2><form id="contact-form" novalidate><div class="form-field"><label for="contact-name">Full Name</label><input id="contact-name" type="text"><small class="field-error"></small></div><div class="form-field"><label for="email">Email Address <span>*</span></label><input id="email" type="email" required><small class="field-error"></small></div><div class="form-field"><label for="subject">Subject</label><input id="subject" type="text"><small class="field-error"></small></div><div class="form-field"><label for="message">Message <span>*</span></label><textarea id="message" rows="7" required></textarea><small class="field-error"></small></div><button type="submit">Send Message</button><p id="contact-message" class="form-message"></p></form></section></main><script src="script.js"></script></body></html>
